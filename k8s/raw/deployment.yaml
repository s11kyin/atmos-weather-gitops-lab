apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmos-weather
  namespace: weather-lab
spec:
  replicas: 1

  selector:
    matchLabels:
      app: atmos-weather

  template:
    metadata:
      labels:
        app: atmos-weather

    spec:
      serviceAccountName: atmos-weather
      
      imagePullSecrets:
        - name: dockerhub-pull-manual

      containers:
        - name: atmos-weather
          image: ritchiekyin/atmos-weather:sha-4383818423f55f06e510ebb6ebb960b564f852d8
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10