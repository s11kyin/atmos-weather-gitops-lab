apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmos-weather

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: atmos-weather

  template:
    metadata:
      labels:
        app: atmos-weather

    spec:
      serviceAccountName: atmos-weather

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}

      containers:
        - name: atmos-weather
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          env:
            - name: SECRET_KEY_FILE
              value: /vault/secrets/flask-secret-key

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10